$kind: http-request
id: 1524c4e4-3996-4711-ab29-5f4e6918aea1
name: v3/seller/messages/send/{type}
description: |-
  **Route:** `POST /api/v3/seller/messages/send/{type}`

  **Authentication:** Seller token: `Authorization: Bearer {{seller_token}}` (shared by v2 and v3; enforced by `seller_api_auth` middleware in v3, by `Helpers::get_seller_by_token()` inside the handler in v2).

  **Handler:** `App\Http\Controllers\RestAPI\v3\seller\ChatController@send_message`

  **Middleware:** `api`, `api_lang`, `seller_api_auth`

  **Registered in:** `routes/rest_api/v3/seller.php:205`


  | Parameter | Required | Rules |
  |---|---|---|
  | `id` | yes | string |
  | `message` | no | string This field is required when none of <code>file</code> and <code>media</code> are present. |
  | `media` | no | file Must be a file. Must not be greater than 2048 kilobytes. |
  | `file` | no | file Must be a file. Must not be greater than 2048 kilobytes. |


  **Responses:** not captured. No endpoint was executed while generating this collection; the shape is defined by the handler above. Validation failures in this codebase typically return `403` with `{"errors": [{"code", "message"}]}`.
url: "{{base_url}}/v3/seller/messages/send/:type"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: lang
