$kind: http-request
id: 912a4056-21a7-4add-a81c-809541b1e39c
name: v3/seller/auth/login
description: |-
  **Route:** `POST /api/v3/seller/auth/login`

  **Authentication:** None (public).

  **Handler:** `App\Http\Controllers\RestAPI\v3\seller\auth\LoginController@login`

  **Middleware:** `api`, `api_lang`

  **Registered in:** `routes/rest_api/v3/seller.php:37`


  | Parameter | Required | Rules |
  |---|---|---|
  | `email` | yes | string |
  | `password` | yes | string Must be at least 6 characters. |


  **Responses:** not captured. No endpoint was executed while generating this collection; the shape is defined by the handler above. Validation failures in this codebase typically return `403` with `{"errors": [{"code", "message"}]}`.
url: "{{base_url}}/v3/seller/auth/login"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: lang
    value: "{{lang}}"
    description: Locale for translated messages (APILocalizationMiddleware).
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "email": "seller@gmail.com",
        "password": "password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login succeeded (200)', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
          const responseBody = pm.response.json();
          pm.test('Response contains token', function () { pm.expect(responseBody.token).to.be.a('string'); });
          if (responseBody.token) { pm.environment.set('seller_token', responseBody.token); }
      }
    language: text/javascript
order: 5000
