  | `unit` | no | string This field is required when <code>product_type</code> is <code>==</code> or <code>physical</code>. |
  | `images` | yes | string |
  | `thumbnail` | yes | string |
  | `discount_type` | yes | string |
  | `tax` | yes | string Must be at least 0 characters. |
  | `lang` | yes | string |
  | `unit_price` | yes | string Must be at least 1 character. |
  | `purchase_price` | yes | string Must be at least 1 character. |
  | `discount` | yes | string |
  | `shipping_cost` | no | string This field is required when <code>product_type</code> is <code>==</code> or <code>physical</code>. |
  | `code` | yes | string |
  | `minimum_order_qty` | yes | number Must be at least 1. |


  **Inputs read without declared validation (static scan):** `brand_id`, `choice`, `choice_attributes`, `choice_no`, `colors`, `colors_active`, `current_stock`, `description`, `meta_description`, `meta_image`, `meta_title`, `multiplyQTY`, `sub_category_id`, `sub_sub_category_id`, `tax_type`, `video_link`


