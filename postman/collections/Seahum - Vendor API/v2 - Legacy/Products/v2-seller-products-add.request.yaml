  | Parameter | Required | Rules |
  |---|---|---|
  | `name` | yes | string |
  | `category_id` | yes | string |
  | `product_type` | yes | string |
  | `digital_product_type` | no | string This field is required when <code>product_type</code> is <code>==</code> or <code>digital</code>. |
