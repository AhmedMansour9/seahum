name: auth/login
description: |-
  **Route:** `POST /api/v1/auth/login`

  **Authentication:** None (public).

  **Handler:** `App\Http\Controllers\RestAPI\v1\auth\CustomerAPIAuthController@login`

  **Middleware:** `api`, `api_lang`

  **Registered in:** `routes/rest_api/v1/api.php:62`


  | Parameter | Required | Rules |
  |---|---|---|
  | `email_or_phone` | yes | string |
  | `password` | yes | string Must be at least 6 characters. |
  | `type` | yes | string |


  **Responses:** not captured. No endpoint was executed while generating this collection; the shape is defined by the handler above. Validation failures in this codebase typically return `403` with `{"errors": [{"code", "message"}]}`.
url: "{{base_url}}/auth/login"
method: POST
headers:
  - key: Accept
    value: application/json
