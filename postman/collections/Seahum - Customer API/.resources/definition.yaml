$kind: collection
id: bdd77699-5ffb-401f-a95e-c0b49e76b78d
description: |-
  Customer mobile/web app API (`/api/v1`). Customers authenticate with Laravel Passport; many catalog and checkout routes also accept a guest via `guest_id`.

  Generated by `docs/postman/tools` from the live route inventory, Scribe static extraction and controller source. No endpoint was executed to build it, so responses are not included. Set `api_host` in the **Seahum Local** or **Seahum Staging** environment.
variables:
  base_url: "{{api_host}}/api/v1"
auth:
  - id: 320b48af-d01f-4794-b940-fdee20d09349
    type: bearer
    name: bearer auth
    credentials:
      token: "{{customer_token}}"
