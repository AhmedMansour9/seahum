name: Fix EasyOrders placement times

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run lists the changes; apply saves them (run apply only once)'
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run command on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          if [ "$MODE" = "dry-run" ]; then FLAG="--dry-run"; else FLAG=""; fi
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && php artisan easy-orders:fix-placement-times --stored-from='2026-11-08 22:46:30' --stored-to='2026-11-09 01:04:45' $FLAG | sed 's/^/FIXLINE /'"
